hallazgos:
- id: INC-0001
  norm: AP-36
  path: ../../vault-backups
  observed: '''vault-backups'' existe 2 nivel(es) por encima del vault (<RUTA-LOCAL> Ivan\Documents\GitHub\vault-backups)
    — side-effect escrito fuera del vault root.'
  environment: escenario A (sandbox canonico)
  root_cause: 'efecto lateral escrito FUERA del vault root (AP-36): un directorio vault-backups existe
    dos niveles por encima del vault; procede de una ejecucion previa de backup'
  reproduction: python scripts/vault_norms.py --audit --root <runtime>
  evidence:
  - audits/architecture/hallazgos-qg02.yaml#INC-0001
  classification: contaminacion de ejecuciones previas
  impact: ''
  severity: critical
  resolution_options: []
  recommended_action: localizar y purgar el directorio con el dueno de los datos (no se borra desde aqui)
    y evitar que las ejecuciones escriban fuera del vault
  decision_required: true
  quality_gate: QG-02
- id: INC-0002
  norm: AP-39
  path: 19_Audits/vocabulary/tag-ledger.json
  observed: 3 terminos en uso sin memoria canonica (command, hub, nav) en un runtime recien creado por
    el producto
  environment: escenario B (runtime limpio creado por el producto)
  root_cause: vault_init crea notas bootstrap con tags que no declaraba como canonicos en su propio tag-registry.json
  reproduction: 'python scripts/vault_init.py  # con VAULT_ROOT apuntando a un runtime nuevo; despues
    python scripts/vault_norms.py --audit --root <rt>'
  evidence:
  - audits/architecture/hallazgos-qg02.yaml#INC-0002
  - commit 2174bb1 (fix(AP-39))
  - 're-auditoria: 0 violaciones en runtime con 75 ficheros'
  classification: violacion real del producto (CORREGIDA)
  impact: un runtime recien creado por el producto violaba la norma que el producto certifica (invariante
    INV-10)
  severity: medium
  resolution_options:
  - declarar los tags bootstrap como canonicos
  - registrar los tags en el ledger al crear las notas
  recommended_action: 'aplicada: categoria ''bootstrap'' en canonical_tags del tag-registry'
  decision_required: false
  quality_gate: QG-02
  estado: CORREGIDO
  commit_correctivo: 2174bb1
  verificacion: 're-auditoria con el codigo actual sobre un runtime de 75 ficheros: 0 violaciones, 0 AP-39'
