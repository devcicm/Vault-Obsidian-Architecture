    si mismo —que el catalogo no diverja del JSON, que la baseline no crezca— y en esa sala no esta el
    consumidor. Esta tool registra cada promesa que se le hace a quien instala (version minima, dependencias,
    plataformas, superficie de red) junto a quien la ejerce de verdad, y falla cuando una promesa marcada
    como cubierta se queda sin ejecutor. Nacio de medir la pregunta en vez de opinarla: pyproject prometia
