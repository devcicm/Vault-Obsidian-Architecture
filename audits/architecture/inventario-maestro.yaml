- id: RES-ADA-1d6e
  name: vault_procesos_git
  nature: interfaz
  type: tool:Normas
  purpose: 'AP-68: el toolkit lanza git desde 24 sitios, y la frontera de lo que puede lanzar dependia
    del criterio de quien escribio cada linea. Todos usaban verbos de lectura salvo el bootstrap de vault_init
    — init/add/commit sobre un vault recien creado—, y todo eso estaba solo en la inspeccion de quien
    lo miro, no en un guard. Esta tool recorre por AST scripts/, cli/, vault/ y mcp/ y publica toda llamada
    que levante git con el lexico ''git'' primero, que tiene que ser cero: el runtime lo aplica vault.kernel.procesos_git.ejecutar_git,
    que rechaza verbo desconocido, mutador sin motivo escrito y el uso mutador de los verbos ambiguos
    (branch -D, tag <nombre>, config k v, stash apply, reflog expire).'
  responsibility: implementa la operacion vault_procesos_git
  owner: meta_toolkit
  source_of_truth: scripts/vault_mcp_catalog.py:TOOLS_CATALOG
  path: mcp/nodejs/tools-catalog.json
