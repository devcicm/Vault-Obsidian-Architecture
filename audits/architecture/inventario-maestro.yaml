- id: RES-ADA-5e18
  name: vault_kernel
  nature: interfaz
  type: tool:Normas
  purpose: 'AP-59: el nucleo se declara pero nadie lo mide. La lista del kernel es una enumeracion escrita
    a mano en vault_arch y ninguna puerta la contrasta con la forma real del grafo. Mide tres invariantes:
    K1 (el nucleo no depende del dominio) delegada en vault_arch.dependencias_del_kernel, K2 (fan-in alto,
    fan-out bajo) desde el dueno unico del grafo de imports, y K3 (estabilidad) por churn de git contra
    la mediana del dominio. Con la lista bien elegida, en v40.20 salieron aun asi tres modulos del kernel
    que no se comportan como nucleo. --trace responde si toco esto, que se cae.'
  responsibility: implementa la operacion vault_kernel
