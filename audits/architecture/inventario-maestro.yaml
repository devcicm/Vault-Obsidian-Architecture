- id: RES-ADA-0bfc
  name: vault_recursos
  nature: interfaz
  type: tool:Normas
  purpose: 'AP-62: el consumidor cruza una frontera de contexto para leer un recurso —una constante, una
    funcion pura— y por el camino paga todo el fan-out del productor. Es el patron que v40.27 encontro
    por accidente en vault_norms: 21 de sus 24 importadores solo querian una tabla y entraban por una
    fachada que arrastra el motor. Esta tool lo busca en los 136 modulos en vez de a ojo, y publica el
    ranking de productores por cuantos cruces colapsaria darle a cada recurso un dueno con forma de hoja.'
  responsibility: implementa la operacion vault_recursos
