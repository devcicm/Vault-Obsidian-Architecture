# Divergencias aceptadas del reconciliador Archify <-> registro vivo.
#
# QUE ES ESTO
# El reconciliador (`audits/fase2/reconciliar_archify.py --check`) confronta el
# SNAPSHOT de Archify (otra revision, versionado en `.archify/`) con el REGISTRO
# VIVO (`scripts/vault_arch.py`). Cuando el codigo cambia de forma intencionada,
# el snapshot queda viejo y el reconciliador lo reporta: eso es correcto, no es
# un fallo del instrumento.
#
# Este archivo es el mecanismo DECLARADO para aceptar divergencias concretas:
# cada entrada nombra la divergencia, su causa, la evidencia y la accion que
# requiere ratificacion. Una entrada NO ratificada NO silencia la divergencia:
# el reconciliador solo la omite si `ratificado: true` Y existe su evidencia.
#
# MIENTRAS LAS ENTRadas NO ESTEN RATIFICADAS, el reconciliador se comporta
# igual que antes: sale con codigo distinto de cero y lista las divergencias.
# Este archivo NO es una via para maquillar el conteo.
#
# ESTADO (2026-10-28): RATIFICADO por el propietario (DEC-02, opcion a: firmar
# las 10 entradas; ver ACTA-DECISIONES-PROPIETARIO-2026-10-28.md). DIV-01 se
# reescribe con su forma vigente tras la ruta B. Historico:
# ESTADO (R15, 2026-10-27): EXPEDIENTE DE FIRMA PREPARADO. Las 10 entradas de
# DIV-01..10 estan escritas con su causa y evidencia, TODAS con
# `ratificado: false`. Verificado tras escribirlas: el reconciliador sigue en
# exit 1 y la baseline en 5/5 — el fichero es inerte hasta la firma.
#
# DECISION PENDIENTE DEL PROPIETARIO (DEC-02, ficha en
# audits/handoff/DECISIONES-PROPIETARIO.md; ver tambien
# audits/architecture/QA-RC-03-CRUZES.md y PLAN-B-MIGRACION-CRUZES.md §11):
#   (a) FIRMAR estas 10 entradas (aceptar que son la cosvisibilidad del
#       movimiento 667a6a5 — NO acepta los cruces: la baseline 5/5 y su
#       fecha limite 2027-06-30 quedan intactas);
#   (b) ordenar RE-TOMAR el snapshot de Archify como revision nueva,
#       preservando f049b1bd y su procedencia;
#   (c) elegir la ruta A/B/C del plan para los dos pares.
# Ninguna de las dos primeras salidas se ejecuta sin su acto expreso.
