  implementation: 'Reconciliado en L1: los 23 pares de contexto coinciden con ficha identica, las 37 dependencias
    existen hoy con esos dos modulos exactos, los 8 accesos fuera de puerto se clasificaron (5 vigentes,
    3 resueltos en ronda 1) y las 2 anclas coinciden con sus motivos.'
  evidence: audits/fase2/matriz-arquitectonica.md y audits/fase2/logs/L1-reconciliacion-archify.txt.
  classification: VIGENTE como evidencia auxiliar; NO es fuente de verdad
  impact: Si se leyera como verdad, contaria 8 accesos fuera de puerto donde hay 5.
