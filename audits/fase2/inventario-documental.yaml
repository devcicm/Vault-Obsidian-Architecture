- id: DOC-0005
  document: docs/sdd/gaps.md
  statement: 'Inventario de brechas detectado al generar el SDD (2026-06-28, vault v36.0): 85+ hallazgos,
    con criticos D2, D3, G1, G2, H1, H2.'
  implementation: 'Es un REGISTRO HISTORICO, no un inventario vigente: el producto va en v41.23. Reconciliation
    en L4-C: H1 CORREGIDA (vault_undo existe), D3 VIGENTE (vault_init --clean borra sin copia), H2 PARCIAL
    (14 de 167 scripts con --dry-run frente a 12 de 94), K3/K4 PARCIALES (21 slugify y 14 utcnow duplicados).'
  evidence: 'audits/fase2/logs/L4-historica.txt: comprobaciones mecanicas de H1, H2, K3, K4 y del camino
    de borrado de --clean.'
  classification: OBSOLETO como inventario; VIGENTE como registro de historia
  impact: 'Quien lea el inventario de brechas creera que hay 85+ problemas abiertos: casi todos son de
    hace cuatro versiones. El riesgo real esta en los que siguen VIGENTES (D3).'
  resolution: 'Marcarlo como historico con fecha y reconciliarlo con el inventario canonico (L4-C, este
    lote). No se borra: es evidencia.'
