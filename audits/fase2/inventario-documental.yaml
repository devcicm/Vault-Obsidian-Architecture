# Inventario documental — fase 2 (L4-A)
#
# Clasificacion de cada documento frente a la implementacion actual.
# Estados: VIGENTE | OBSOLETO | CONTRADICTORIO | INCOMPLETO | NO_VERIFICADO.
# Ningun documento derivado se edita a mano: sus correcciones salen del
# registro que los deriva.

- id: DOC-0001
  document: README.md (seccion Quick Start)
  statement: 'El quick start mezcla dos superficies: `vault init`, `vault tools list`, `vault --version`,
    `vault mcp-path` (el producto instalado) y `python scripts/vault_project.py`, `python scripts/vault_write.py`,
    `python scripts/vault_audit.py` (el checkout). La instalacion que documenta es `pip install -e .`.'
  implementation: 'Un consumidor que instala la WHEEL no tiene el directorio scripts/: la secuencia documentada
    se rompe en la mitad. El camino del producto instalado SI esta documentado, pero en otro documento
    (docs/INSTALACION-LIMPIA.md).'
  evidence: 'audits/fase2/logs/L4-documental.txt: extraccion de los comandos del Quick Start (usa ''python
    scripts/'' y tambien ''vault '') y comprobacion de que la instalacion documentada es `pip install
    -e .`.'
  classification: INCOMPLETO
  impact: 'La puerta de entrada del producto no dice que supuesto hace: el lector con la wheel instalada
    copia comandos que no existen en su maquina. No es un defecto del producto, es un defecto de orientacion.'
  resolution: Documentar en el Quick Start que es el camino del checkout, y enlarzar al de la instalacion
    limpia. Correccion DOCUMENTAL no destructiva; no se aplica en este lote (queda para revision de QA
    y del propietario).
