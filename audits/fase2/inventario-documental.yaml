  document: docs/product/prd-cli.md, docs/product/prd-mcp.md, docs/product/runtime-contract.md
  statement: Requisito de producto de CLI, de MCP y contrato de runtime.
  implementation: 'NO VERIFICADO en este lote: no se ha contrastado cada afirmacion de los tres documentos
    con el codigo. Si se ha medido la superficie que describen: 126 tools en el catalogo, 97 expuestas
    por MCP, 0 de gobernanza entre ellas, 96 operaciones en la superficie CLI.'
  evidence: 'audits/fase2/logs/L4-documental.txt: superficie medida (catalogo, MCP, operaciones).'
