# Catalogo de Quality Gates — fase 2 (propuesta para dictamen QA)
#
# Los QG son PUERTAS DE DECISION que consumen verificaciones tecnicas ya
# existentes (las 26 puertas, los gates de producto, el verificador AP-40, el
# reconciliador, el verificador de saneamiento). No duplican las 26: consumen
# su resultado y anaden las condiciones de decision que faltaban.
#
# Estados: PASS | FAIL | BLOCKED | NOT_RUN | NOT_APPLICABLE
# Regla fail-closed: una puerta no ejecutada es NOT_RUN, nunca PASS.
# Un BLOCKED no se convierte en PASS sin una nueva evidencia.
#
# La POLITICA de este catalogo (QG-00 prerrequisito, evidencia de otro SHA,
# QG-02 condicionado por el estado de ejecucion, QG-07 con CI concluyente) la
# aplica `audits/fase2/politica_qg.py`; sus pruebas negativas viven en
# `tests/test_fase2_politica_qg.py`. Lo que aqui se escribe en prosa se ejecuta
# alli: un catalogo sin evaluador es una declaracion de intenciones.

- id: QG-00
  name: "Identidad, aislamiento y trazabilidad"
  version: "1.0"
  purpose: "Demostrar que el codigo verificado es el que se declara: rama, SHA, arbol limpio, alcance autorizado, evidencias pertenecientes a ese SHA y ausencia de modificaciones no autorizadas."
  owner: "agente ejecutor"
  acceptance_authority: "QA arquitectonico"
  scope: [toda la rama de trabajo, las evidencias publicadas]
  checks:
    - "git rev-parse HEAD == SHA declarado en el informe"
    - "git status --porcelain vacio o justificado"
    - "las evidencias de audits/fase2/logs/ existen y corresponden al SHA"
    - "el verificador de saneamiento (comprobar_saneamiento.py) sale 0"
    - "el reconciliador de Archify en modo --check sale 0"
  required_evidence: [status del arbol, SHA, salida del verificador de saneamiento, salida del reconciliador]
  pass_criteria: ["los cinco checks anteriores sin desviacion"]
  fail_criteria: ["arbol sucio sin justificar, evidencias de otro SHA, o una fuga de saneamiento"]
  blocking_policy: "bloquea cualquier otro QG"
  timeout_policy: "n/a (comandos instantaneos)"
  waiver_policy: "no permitida: la identidad no se exime"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-01
  name: "Arquitectura, puertos y contratos"
  version: "1.0"
  purpose: "Fronteras, dependencias y propiedad, con los cinco cruces D-H gestionados como deuda explicita y con el snapshot de Archify reconciliado."
  owner: "meta_toolkit - vault_arch"
  acceptance_authority: "QA arquitectonico"
  scope: [los diez contextos, la baseline de cruces, el snapshot de Archify]
  checks:
    - "python scripts/vault_arch.py --check --strict"
    - "python audits/fase2/reconciliar_archify.py --check"
    - "invariantes: new_off_port_crossings == [], off_port_total <= 5, off_port_baseline == 5"
  required_evidence: [salida del guard, salida del reconciliador en modo check]
  pass_criteria: ["exit 0 y los tres invariantes"]
  fail_criteria: ["cualquier cruce nuevo, baseline ampliada, o un invariante roto"]
  blocking_policy: "bloquea QG-03 y QG-07"
  timeout_policy: "900 s"
  waiver_policy: "solo con decision del propietario y fecha de vencimiento (nunca para seguridad)"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-02
  name: "Gobernanza y normas"
  version: "1.0"
  purpose: "Que los controles realmente se ejecuten y detecten lo que prometen, con el estado del sandbox documentado y reproducible."
  owner: "gobernanza - vault_norms"
  acceptance_authority: "QA arquitectonico"
  scope: [las 26 puertas, el estado de ejecucion de AP-40/AP-42/AP-43]
  checks:
    - "python scripts/vault_gate.py --strict (las 26 puertas)"
    - "estado del sandbox documentado (bootstrap canonico, verificado)"
    - "el envelope de la auditoria declara el estado de ejecucion por control"
    - "PENDIENTE (TD-0003): mientras el runtime no publique estados, la puerta queda BLOCKED con CONTROL_OBLIGATORIO_NO_VERIFICADO"
  required_evidence: [salida de vault_gate, documentacion del sandbox, la seccion checks del envelope con el estado de AP-40, AP-42 y AP-43]
  pass_criteria: ["26/26 puertas Y todos los controles obligatorios en estado ejecutado SIN degradados (completo: true)"]
  fail_criteria: ["una puerta tecnica fallida, o un control degradado, o un control no ejecutado, o la ausencia de estados de ejecucion en el envelope (BLOCKED con CONTROL_OBLIGATORIO_NO_VERIFICADO)"]
  nota: "26/26 puertas tecnicas aprobadas NO elimina el problema TD-0003: las puertas pueden estar verdes y el control haberse saltado. El PASS exige la evidencia del estado de ejecucion."
  blocking_policy: "bloquea QG-07"
  timeout_policy: "1200 s"
  waiver_policy: "no permitida"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-03
  name: "Integridad funcional y regresiones"
  version: "1.0"
  purpose: "Comportamiento observable del runtime: suite integral, idempotencia, recuperacion, escrituras atomicas, preservacion de datos y pruebas negativas."
  owner: "agente ejecutor"
  acceptance_authority: "QA arquitectonico"
  scope: [la suite pytest, los gates de producto, el recorrido MVP]
  checks:
    - "python -m pytest tests/ -q -n auto --tb=short"
    - "el gate memory_recovery_e2e (canario, persistencia, aislamiento del checkout)"
    - "el recorrido MVP (16 pasos) sin fallos"
  required_evidence: [log completo de la suite, salida de los gates de producto, log del recorrido]
  pass_criteria: ["0 failed; los skipped con causa documentada"]
  fail_criteria: ["cualquier failed, o una perdida de datos en el recorrido"]
  blocking_policy: "bloquea QG-07"
  timeout_policy: "2400 s"
  waiver_policy: "no permitida"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-04
  name: "Seguridad"
  version: "1.0"
  purpose: "Impedir riesgos no aceptados en el producto distribuible: secretos, contencion de rutas, superficie de entrada, dependencias y operaciones destructivas."
  owner: "agente ejecutor"
  acceptance_authority: "QA arquitectonico + propietario"
  scope: [secretos, contencion, superficie MCP y CLI, dependencias, operaciones destructivas]
  checks:
    - "comprobar_saneamiento.py sobre las evidencias"
    - "el guard de secretos en la escritura (presente en la wheel)"
    - "contencion: el escape por CLI y MCP es rechazado (medido en el recorrido)"
    - "la operacion destructiva --clean declara y preserva via de recuperacion (TD-0008, PENDIENTE)"
    - "auditoria de vulnerabilidades de dependencias (PENDIENTE: pip-audit)"
  required_evidence: [salida del verificador, log del recorrido (contencion), METADATA de la wheel, hallazgos de dependencias]
  pass_criteria: ["sin vulnerabilidad confirmada y explotable; los controles criticos ejecutados"]
  fail_criteria: ["una fuga de secretos, un escape de contencion, o un control critico no ejecutado"]
  blocking_policy: "bloquea QG-07"
  timeout_policy: "300 s"
  waiver_policy: "solo con propietario, causa, mitigacion y vencimiento; nunca para integridad de datos"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-05
  name: "Paridad CLI <-> MCP"
  version: "1.0"
  purpose: "Que los dos adaptadores cumplan el mismo contrato de negocio: misma operacion, mismos argumentos, mismo efecto y mismo significado de error, medido sobre resultados normalizados y sobre los EFECTOS reales del runtime."
  owner: "agente ejecutor"
  acceptance_authority: "QA arquitectonico"
  scope: [las operaciones con identidad propia, el verificador AP-40, los efectos sobre el runtime]
  checks:
    - "python audits/fase2/paridad_cli_mcp.py --venv --runtime (fail-closed)"
    - "python scripts/vault_mcp_catalog.py --check-params (AP-40)"
    - "el verificador declara su alcance: casos medidos frente a tools expuestas"
  required_evidence: [log de paridad, matriz, salida de AP-40]
  pass_criteria: ["evaluar() conforme y AP-40 exit 0"]
  fail_criteria: ["cualquier problema del verificador"]
  blocking_policy: "bloquea QG-07"
  timeout_policy: "1800 s"
  waiver_policy: "solo con la divergencia documentada y aceptada por QA"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-06
  name: "Instalacion y distribucion"
  version: "1.0"
  purpose: "El producto desde la perspectiva de un tercero: construir, instalar en venv nuevo fuera del checkout, runtime externo, entry points, MCP empaquetado, sin rutas al checkout y sin artefactos ajenos."
  owner: "agente ejecutor"
  acceptance_authority: "QA arquitectonico"
  scope: [la wheel, el venv del consumidor, el runtime externo, el contenido del artefacto]
  checks:
    - "construir la wheel y auditar su contenido (TD-0002, verificado: sin trazas)"
    - "instalar en venv nuevo fuera del checkout"
    - "entry point vault y arranque del MCP empaquetado"
    - "el gate clean_install (el verificador del repo)"
  required_evidence: [contenido del artefacto, log del gate clean_install, METADATA]
  pass_criteria: ["el gate clean_install en PASS y el contenido del artefacto conforme"]
  fail_criteria: ["instalacion rota, dependencia ausente, acoplamiento al checkout, o artefacto ajeno dentro"]
  blocking_policy: "bloquea QG-07"
  timeout_policy: "1800 s"
  waiver_policy: "no permitida"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]

- id: QG-07
  name: "Aprobacion del producto"
  version: "1.0"
  purpose: "Decidir si una version puede entregarse a terceros. Es una DECISION, no una suma de pruebas."
  owner: "propietario del producto"
  acceptance_authority: "QA arquitectonico (verifica) + propietario (autoriza)"
  scope: [el SHA del release candidate]
  checks:
    - "QG-00..QG-06 en PASS para ESE SHA (QG-00 es prerrequisito: sin identidad verificada, las demas puertas quedan BLOCKED)"
    - "CI del SHA con conclusion (no queued): matriz multiplataforma, wheel y JSON-RPC"
    - "riesgos residuales aceptados y documentados"
    - "documentacion coherente (TD-0005) y versionado definido"
  required_evidence: [los QG previos, el estado de CI del SHA, el inventario de riesgos]
  pass_criteria: ["todas las condiciones anteriores"]
  fail_criteria: ["CI sin conclusion, un P0/P1 sin mitigacion, o una evidencia faltante"]
  blocking_policy: "es la ultima puerta: su fallo impide el release"
  timeout_policy: "depende de la cola de CI"
  waiver_policy: "una condicion pendiente (como CI) deja la puerta BLOCKED, nunca PASS"
  results: [PASS, FAIL, BLOCKED, NOT_RUN, NOT_APPLICABLE]