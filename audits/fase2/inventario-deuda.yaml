# Registro de deuda tecnica — fase 2 (L1)
#
# Esquema: el que fijo la orden de fase 2, verbatim. Los identificadores son
# unicos, estables y no reutilizables.
#
# `status` usa el vocabulario de la orden (VIGENTE / CORREGIDA / PARCIAL /
# FALSO POSITIVO / NO VERIFICADA / ACEPTADA CON RIESGO) en minusculas, y
# `decision` es la del esquema (pending / accepted / rejected / deferred).
# El lote de descubrimiento y la evidencia cruda viven en `backlog.md` y en
# `audits/fase2/logs/`, para no ensuciar el esquema.
#
# SHA base del descubrimiento: ef77a7b (rama auditada, cierre de ronda 1B).

- id: TD-0001
  title: 'El job de CI que valida la wheel no instala el paquete: la validacion de release en CI es imposible'
  category: distribution
  severity: P1
  status: parcial
  owner: meta_toolkit - vault_arch
  context: GitHub Actions, job 'Product gates (wheel)'
  source_file: .github/workflows/vault-ci.yml
  symbol: job Product gates (wheel) / paso 'Run product gates'
  commit_sha: ef77a7b19a6aaa5e8a5bf776181ab887b7ee4587
  observed_behavior: 'El job construye la wheel (''python -m build'') y ejecuta ''python tests/run_product_gates.py''
    SIN instalar antes el paquete ni sus dependencias; ''pip install dist/*.whl'' ocurre DESPUES, en el
    paso de SBOM. El job falla con ModuleNotFoundError: No module named ''yaml'' en todos los sistemas
    y versiones de la matriz. CAUSA RAIZ CONFIRMADA Y REPRODUCIDA (L3): tests/clean_install_gate.py importa
    el paquete (vault.meta_toolkit.distribucion -> frontmatter_parsing -> import yaml) en el interprete
    del RUNNER, y ese interprete solo tiene ''build'' instalado: la dependencia PyYAML, DECLARADA en pyproject.toml,
    nunca llega a estarlo. El gate moria antes de empezar a medir.'
  expected_behavior: 'El job debe ejecutar las puertas del producto sobre el ARTEFACTO INSTALADO: instalar
    la wheel construida (y por tanto sus dependencias declaradas) antes de correr las verificaciones.'
  root_cause: 'El orden de pasos del job omite la instalacion del artefacto: las puertas de producto se
    ejecutan contra el checkout, no contra la wheel, y las dependencias declaradas (PyYAML>=6.0 en pyproject.toml)
    nunca se instalan en ese job.'
  impact: 'Ningun SHA de la rama ha pasado nunca por la validacion de producto en CI: el job es estructuralmente
    incapaz de pasar. QG-06 (instalacion y distribucion) y QG-07 (aprobacion de release) no pueden apoyarse
    en la CI, y el unico veredicto posible hoy es PENDIENTE DE VALIDACION EXTERNA.'
  likelihood: 'Cierto: se reproduce en los cuatro runs completados con fallo (SHAs 3adc050, 08a2ddf, 40d81e6,
    8885c79), siempre en ''Product gates (wheel)'' y siempre con el mismo error de dependencia.'
  evidence:
  - 'audits/fase2/logs/L3-TD0001-antes.txt: reproduccion en un venv ''runner'' que replica el job (solo
    build, sin PyYAML) -> clean_install FAIL, ModuleNotFoundError: No module named ''yaml'' en tests/clean_install_gate.py:48'
  - 'audits/fase2/logs/L3-TD0001-despues.txt: el mismo venv tras instalar la wheel construida (el paso
    nuevo) -> clean_install PASS, memory_e2e PASS, Overall ALL PASS, exit 0'
  - '.github/workflows/vault-ci.yml: pasos del job ''Product gates (wheel)'' (build -> install wheel ->
    run product gates -> SBOM)'
  affected_contracts:
  - 'Producto distribuible: la wheel es el artefacto que recibe un tercero'
  - QG-06 instalacion y distribucion
  - QG-07 aprobacion de release
  related_norms:
  - AP-40 (contrato de parametros)
  - AP-48 (implementacion paralela)
  related_tests:
  - tests/run_product_gates.py (el verificador que el job no puede ejecutar)
  proposed_remediation: 'APLICADO (autorizacion condicional del propietario y QA): paso nuevo ''Install
    wheel (artefacto y dependencias declaradas)'' antes de ''Run product gates'', con shell bash para
    que el glob de la wheel se expanda igual en los tres sistemas (mismo shell que ya usa el paso de SBOM
    de ese job). No se toca el producto, ni los tests, ni la cobertura.'
  regression_risk: 'Bajo: el job no forma parte del producto. Lo unico que cambia es que el runner tiene
    el artefacto instalado, que es lo que el gate pretendia medir desde siempre.'
  acceptance_criteria:
  - 'CUMPLIDO: el job ''Product gates (wheel)'' instala la wheel antes de las puertas; verificado localmente
    con la misma secuencia (antes FAIL, despues ALL PASS).'
  - 'CUMPLIDO: reproduccion local de la secuencia exacta del job en un venv nuevo.'
  - 'PENDIENTE: el run de CI del SHA corregido llega a conclusion y su conclusion es concluyente (no ''queued'').
    La rama de fase 2 necesita un PR para que el evento pull_request dispare el workflow: decision del
    propietario.'
  quality_gate: QG-06
  decision: pending
- id: TD-0002
  title: Las trazas runtime del servidor MCP caen dentro del paquete de la wheel y no estan excluidas
  category: distribution
  severity: P2
  status: falso_positivo
  owner: meta_toolkit - vault_arch
  context: 'Empaquetado de la wheel: package-dir mapea mcp/nodejs -> vault_toolkit.mcp'
  source_file: pyproject.toml
  symbol: '[tool.setuptools] package-dir / exclude-package-data'
  commit_sha: ef77a7b19a6aaa5e8a5bf776181ab887b7ee4587
  observed_behavior: 'HIPOTESIS NO CONFIRMADA: el directorio mcp/nodejs/ contiene dos trazas de runtime
    sin versionar (mcp-trace-log.json de 494 KB y mcp-trace-log.md de 464 KB) y el paquete de la wheel
    se construye con package-dir {"vault_toolkit.mcp" = "mcp/nodejs"}. MEDIDO (L3): la wheel NO contiene
    ninguna traza de runtime, ni construida desde el checkout ni desde una copia limpia sin .git: ambas
    dan 1.661.092 bytes, 705 miembros, 0 trazas y 4 ficheros en vault_toolkit/mcp/. El motivo es DECLARATIVO,
    no suerte: [tool.setuptools.package-data] nombra para vault_toolkit.mcp exactamente los cuatro ficheros
    que si deben viajar (vault-mcp-server.mjs, tools-catalog.json, env-table.json, mmd_validate.mjs),
    de modo que los demas ficheros del directorio no entran.'
  expected_behavior: Un artefacto distribuible no lleva trazas de runtime, ni de tamaño ni con datos de
    la sesion que las genero.
  root_cause: El patron de exclusion no cubre las trazas del servidor MCP, que viven en un directorio
    mapeado al paquete.
  impact: 'Posible: la wheeluede crecer casi un megabyte y publicar trazas de ejecucion ajenas al producto.
    La severidad queda en P2 porque la exposicion real (que datos contienen esas trazas) no se ha medido
    todavia.'
  likelihood: 'Probable: los ficheros estan presentes en el arbol de trabajo en cuanto el servidor MCP
    ha corrido una vez.'
  evidence:
  - 'audits/fase2/logs/L3-wheel-contenido.txt: inspeccion del .whl construido (checkout y copia limpia
    sin .git): 0 trazas runtime, 4 ficheros en vault_toolkit/mcp/'
  - 'pyproject.toml: [tool.setuptools.package-data] declara los 4 ficheros que viajan; el resto del directorio
    no entra'
  affected_contracts:
  - 'Producto distribuible: contenido del artefacto'
  - QG-06 instalacion y distribucion
  - QG-04 seguridad (datos sensibles en logs)
  related_norms:
  - AP-36 (escrituras dentro de la raiz autorizada)
  - AP-47 (artefactos derivados)
  related_tests: []
  proposed_remediation: 'NINGUNA: la hipotesis queda refutada por medicion. Se conserva la evidencia (contenido
    real del artefacto) y el mecanismo declarativo que lo garantiza; la comprobacion de contenido del
    artefacto pasa a formar parte de QG-06, que ya tiene su verificador (clean_install_gate).'
  regression_risk: Ninguno.
  acceptance_criteria:
  - 'CUMPLIDO: la wheel construida no contiene trazas de runtime (medido sobre el artefacto, en los dos
    escenarios de build).'
  - 'CUMPLIDO: los 4 ficheros que si viajan estan declarados uno a uno en package-data.'
  quality_gate: QG-06
  decision: pending
- id: TD-0003
  title: 'Un control que no puede cargar su dependencia informa cero hallazgos: la ausencia de hallazgos
    no significa ejecucion'
  category: governance
  severity: P1
  status: vigente
  owner: gobernanza - vault_norms_engine
  context: 'AP-40, AP-42 y AP-43: el motor de auditoria importa su verificador en diferido y captura el
    fallo con pass'
  source_file: scripts/vault_norms_engine.py
  symbol: 'bloques except (ImportError, OSError, ValueError): pass en las líneas 151, 179 y 196'
  commit_sha: ef77a7b19a6aaa5e8a5bf776181ab887b7ee4587
  observed_behavior: 'El envelope de la auditoria (vault/gobernanza/auditoria_runtime.py) publica ok=True
    HARDCODEADO, total_violations, by_norm y violations, y NO tiene ningun campo que declare que controles
    se ejecutaron. Los tres controles del estandar viven en scripts/vault_norms_engine.py::_checks_estandar
    (AP-40 lineas 141-152, AP-42 159-180, AP-43 186-197), cada uno con ''except (ImportError, OSError,
    ValueError): pass''. _checks_estandar no devuelve nada: su unico canal de salida es flag(norm,...).
    DEMOSTRADO (L2, audits/fase2/demostrar_control_degradado.py): con la dependencia sana el control aparece
    en by_norm con su hallazgo; con la dependencia rota desaparece y el envelope NO declara que no se
    pudo ejecutar. Medido en las tres familias (AP-40, AP-42, AP-43).'
  expected_behavior: Un control debe distinguir EJECUTADO / DEGRADADO / FALLIDO / NO EJECUTADO, y un control
    no ejecutado no puede presentarse como 'sin hallazgos'.
  root_cause: 'El contrato de salida no tiene estados de ejecucion: un control se comunica con el mundo
    por sus hallazgos y no por su estado, de modo que ''no se pudo mirar'' y ''no se encontro nada'' son
    la misma senal. La causa no es el except en si, sino que el except no tiene donde dejar constancia
    porque el contrato no lo contempla.'
  impact: 'El audit puede informar ''cero hallazgos'' sin haber ejecutado la comprobacion: un resultado
    falso que se lee como aprobacion. Es la clase de defecto que el propio AP-43 distingue de una norma
    silenciosa.'
  likelihood: Cierto en cuanto falla la dependencia (import ausente, baseline corrupta o error de permisos);
    es la razon por la que estos accesos siguen congelados y por la que las dos fichas de cruce que los
    cubren declaran objetivo a_eliminar con fecha limite 2027-06-30.
  evidence:
  - 'audits/fase2/logs/L2-control-degradado.json: seis mediciones (tres controles por dos estados) — con
    la dependencia sana el control aparece en by_norm; con la dependencia rota desaparece y el envelope
    no avisa (el campo de estado no existe)'
  - 'audits/fase2/demostrar_control_degradado.py: el instrumento, reejecutable'
  - 'audits/fase2/L2-analisis-q04-q07.md: causa, consumidores, via arquitectonica y contrato propuesto'
  - scripts/vault_norms_engine.py:151,179,196 (los tres bloques except -> pass)
  - 'scripts/vault_norms.py:584-594 (LECTURA DE CODIGO: el veredicto --strict depende solo de total_violations;
    con un control degradado, cero violaciones y exit 0 — no medido en un vault sintetico: el montaje
    arrastraba violaciones propias)'
  - 'scripts/vault_norms_coherence.py:652 (la puerta de coherencia compara by_norm antes/despues: si un
    control no se ejecuta en ninguno de los dos pases, ve ''sin cambios'')'
  affected_contracts:
  - AP-40, AP-42, AP-43 (resultado de un control de gobernanza)
  - QG-02 gobernanza y normas
  related_norms:
  - AP-40
  - AP-42
  - AP-43
  related_tests:
  - tests/test_vault_norms_audit.py
  - tests/test_norms_coherence.py
  - tests/test_smoke.py
  - tests/test_voice.py
  proposed_remediation: 'PROPUESTA, NO IMPLEMENTADA (la autorizacion de la ronda es de investigacion).
    Via A + B, que es lo que el propio registro ya decidio: INVERSION, que el motor no importe los verificadores
    (que los ejecute su dueno y le pase el resultado), junto con un CONTRATO que declare el estado de
    ejecucion por control (ejecutado | degradado | fallido | no_ejecutado) en el envelope, con ''ok''
    sin cambiar por compatibilidad y un campo hermano ''completo'' que distinga ''no hay hallazgos'' de
    ''no se pudo mirar''. La via C (formalizar check_params/load_baseline/coverage como puertos) se descarta:
    formaliza justo lo que las dos fichas de cruce declaran a_eliminar antes del 2027-06-30 y deja el
    defecto vivo. Detalle, consumidores y pruebas propuestas: audits/fase2/L2-analisis-q04-q07.md'
  regression_risk: 'Medio: cambiar el envelope de un control puede afectar a sus consumidores (los audits
    y las puertas). Por eso L2 exige caso positivo, caso negativo y dependencia fallida antes de tocar
    nada.'
  acceptance_criteria:
  - 'PENDIENTE DE DICTAMEN: el control con dependencia rota declara su estado y la auditoria no se presenta
    como limpia (hoy el envelope no dice nada).'
  - 'PENDIENTE DE DICTAMEN: la CLI y la puerta de coherencia distinguen ''sin hallazgos'' de ''no se pudo
    mirar''.'
  - 'PENDIENTE DE DICTAMEN: el envelope de un control sano es IDENTICO al de antes mas la seccion de estados
    (sin regresion de consumidores).'
  quality_gate: QG-02
  decision: pending
- id: TD-0004
  title: Reconciliacion del snapshot de Archify con el codigo actual
  category: architecture
  severity: P2
  status: corregida
  owner: meta_toolkit - vault_arch
  context: Inventario de contextos y cruces frente al snapshot de Archify (.archify/extraccion-registro.json)
  source_file: audits/fase2/reconciliar_archify.py
  symbol: reconciliacion de pares de contexto, dependencias, accesos fuera de puerto y anclas
  commit_sha: ef77a7b19a6aaa5e8a5bf776181ab887b7ee4587
  observed_behavior: El snapshot de Archify (revision previa) declaraba 10 contextos, 23 pares de cruce
    con ficha, 37 dependencias a nivel de fichero, 8 accesos fuera de puerto y 2 anclas del puente.
  expected_behavior: Cada elemento del snapshot se clasifica como vigente, resuelto o no conciliable,
    con la evidencia de a que commit se resolvio cuando aplique.
  root_cause: 'No habia ninguna conciliacion entre el snapshot y el codigo: los diagramas se citaban como
    si fueran el estado actual.'
  impact: Sin conciliacion, la deuda se cuenta dos veces (snapshot + codigo) y se atribuyen al snapshot
    cruces ya resueltos. Resuelto en L1.
  likelihood: Resuelto.
  evidence:
  - 'audits/fase2/logs/L1-reconciliacion-archify.txt: 23/23 pares de contexto coinciden con ficha identica;
    37 dependencias colapsan a 23 pares, los 23 vigentes; 8 accesos fuera de puerto clasificados (5 vigentes
    = TD-0003, 3 resueltos en ronda 1 con su commit); anclas 2/2 con motivos identicos'
  - 'audits/fase2/matriz-arquitectonica.md: matriz de los diez contextos, derivada del registro'
  affected_contracts:
  - Inventario de la auditoria de fase 2
  related_norms:
  - AP-49 (vinculos congelados)
  related_tests:
  - tests/test_arquitectura.py
  proposed_remediation: 'Ninguna: la conciliacion queda ejecutable y repetible (python audits/fase2/reconciliar_archify.py),
    de modo que una revision futura vuelve a confrontar el snapshot sin trabajo manual. Modo --check:
    sale con codigo distinto de cero ante cualquier divergencia NO aceptada; el modo informativo sigue
    emitiendo el inventario sin bloquear. La conciliacion distingue DOS niveles: por par de contexto (23/23
    con ficha identica) y EXACTA por modulo y fichero (37/37 dependencias del snapshot existen hoy con
    esos dos modulos exactos).'
  regression_risk: 'Ninguno: es una herramienta de auditoria, no toca el producto.'
  acceptance_criteria:
  - El reconciliador corre y emite informe reproducible en cada ronda.
  - python audits/fase2/reconciliar_archify.py --check devuelve 0 con el estado actual y != 0 si alguien
    introduce una dependencia divergente.
  quality_gate: QG-01
  decision: accepted
