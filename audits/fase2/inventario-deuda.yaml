- id: TD-0009
  title: El Quick Start del README mezcla la superficie del checkout con la del producto instalado
  category: documentation
  severity: P2
  status: vigente
  owner: producto - por designar
  context: Puerta de entrada del producto
  source_file: README.md
  symbol: seccion Quick Start
  commit_sha: ef77a7b19a6aaa5e8a5bf776181ab887b7ee4587
  observed_behavior: La secuencia documentada usa `vault init/tools list/mcp-path` (el producto instalado)
    y TAMBIEN `python scripts/vault_write.py`, `python scripts/vault_project.py`, `python scripts/vault_audit.py`
    (el checkout). La instalacion documentada es `pip install -e .`.
  expected_behavior: El quick start declara que supuesto usa, o documenta los dos caminos.
  root_cause: El README se escribio desde el checkout, donde las dos superficies existen; para un consumidor
    de la wheel no lo estan.
  impact: Un tercero con la wheel instalada copia comandos que no existen en su maquina. El camino del
    producto instalado SI esta documentado, pero en otro documento (docs/INSTALACION-LIMPIA.md).
  likelihood: Cierto para quien instale la wheel sin checkout.
  evidence:
  - 'audits/fase2/logs/L4-documental.txt: extraccion de los comandos del Quick Start y de la instalacion
    documentada'
  affected_contracts:
  - QG-06 instalacion y distribucion
  related_norms: []
  related_tests:
  - tests/test_quickstart_del_readme.py (mide el camino del checkout)
  proposed_remediation: Declarar en el Quick Start que supuesto hace, y enlazar al camino de instalacion
    limpia. Correccion documental; no se aplica en este lote (queda para revision).
  regression_risk: 'Ninguno: es documentacion.'
  acceptance_criteria:
  - 'PENDIENTE: el Quick Start declara su supuesto o enlaza el camino instalado.'
  quality_gate: QG-07
  decision: pending

- id: TD-0010
  title: La politica de QG acreditaba un estado sin SHA objetivo ni evidencias (H-F2-04)
  category: verification
  severity: P1
  status: corregida
  owner: gobernanza - politica_qg
  context: 'Dictamen QA R01-R05: fail-closed de Quality Gates'
  source_file: audits/fase2/politica_qg.py
  symbol: _evidencia_ajena / evaluar_politica
  commit_sha: 0a583da
  observed_behavior: Con todos los gates declarados PASS, control de ejecucion completo y CI success,
    evaluar_politica devolvia liberable=true sin sha_objetivo y sin evidencias.
  expected_behavior: Sin SHA objetivo valido y sin evidencia por gate no hay PASS; el gate queda BLOCKED.
  root_cause: '_evidencia_ajena() devolvia False cuando faltaba el dato: fail-open en el punto exacto
    donde el contrato exige fail-closed.'
  impact: Un QG podia declararse liberable sin una sola evidencia verificable.
  likelihood: Alta en cualquier estado construido a mano o por un colector incompleto.
  evidence:
  - 'Reproduccion: estado sin evidencias ni SHA -> liberable=true antes de 0a583da'
  - 'tests/test_fase2_politica_qg.py: seis pruebas negativas de datos faltantes'
  affected_contracts:
  - 'Quality Gates: QG-00 y QG-07'
  related_norms:
  - AP-52 (contrato de error) por analogia: no emitir exito sin acreditacion
  related_tests:
  - tests/test_fase2_politica_qg.py (15 pruebas)
  proposed_remediation: 'Aplicada: SHA obligatorio (7-40 hex), evidencia obligatoria por gate y
    evidencia de otro SHA bloqueada.'
  regression_risk: 'Bajo: solo se anaden condiciones de bloqueo.'
  acceptance_criteria:
  - 'CUMPLIDO: sin evidencias o sin SHA, liberable=false.'
  quality_gate: QG-00
  decision: accepted
