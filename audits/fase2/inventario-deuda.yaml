- id: TD-0012
  title: El auditor historico sobreafirmaba su alcance y contaba mal sus commits (H-F2-06)
  category: observability
  severity: P2
  status: corregida
  owner: gobernanza - auditoria historica
  context: 'Dictamen QA R01-R05: reserva de alcance sobre R01'
  source_file: audits/fase2/auditar_exposicion_historica.py
  symbol: escanear_historia
  commit_sha: d175917
  observed_behavior: El informe decia cobertura por blobs; el instrumento recorre parches. commits_escaneados
    contaba solo los commits con hallazgos (8) y se publicaba junto a commits_con_exposicion (10).
  expected_behavior: Declarar que se inspeccionan deltas, publicar commits_considerados, ficheros,
    deltas, blobs (0), errores, y no extrapolar a toda la historia.
  root_cause: La metrica se agrego dentro del bloque que solo se ejecuta cuando hay hallazgos.
  impact: Una conclusion de privacidad apoyada en cifras que no median lo que decian medir.
  likelihood: 'Alta: el error estaba en el propio instrumento de medida.'
  evidence:
  - 'audits/fase2/logs/H-F2-01-exposicion-historica.json con commits_considerados=52, blobs=0'
  - 'tests/test_fase2_hf201_privacidad.py: prueba de historia sin hallazgos'
  affected_contracts:
  - 'Auditoria de exposicion historica'
  related_norms:
  - AP-44 (medir con el criterio del consumidor)
  related_tests:
  - tests/test_fase2_hf201_privacidad.py (11 pruebas)
  proposed_remediation: 'Aplicada: metricas separadas, docstring corregido y reconciliacion en el
    informe R01; el blob antiguo con el nombre real se declara y no se reescribe.'
  regression_risk: 'Ninguno sobre el producto: es un instrumento de auditoria.'
  acceptance_criteria:
  - 'CUMPLIDO: blobs_inspeccionados=0 declarado y commits_considerados >= commits_con_exposicion.'
  quality_gate: QG-00
  decision: accepted
