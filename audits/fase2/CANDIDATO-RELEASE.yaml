# Manifiesto del candidato de release — ronda R14 (QA-R13-06)
#
# Contrato del GOAL R14 §5. Cada valor viene de un verificador o de un
# recibo; los campos marcados PENDIENTE se fijan en el delta documental que
# sigue a la conclusión de la corrida de CI del product_sha (no se reutilizan
# corridas de otro SHA: NEG-08).
#
# Convención de identidad (el manifiesto vive DENTRO del commit candidato):
#   product_sha       = el commit de congelación del código de producto (se
#                       fija en el delta documental tras la CI, porque el
#                       hash del commit que contiene este manifiesto no puede
#                       autoreferenciarse).
#   documentation_sha = el commit documental que publica el resultado de la
#                       corrida y este manifiesto definitivo.

