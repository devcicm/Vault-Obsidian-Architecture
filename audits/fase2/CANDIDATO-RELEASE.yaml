# Notas de integridad:
# - La wheel NO es reproducible byte a byte (el ZIP lleva marcas de tiempo):
#   el hash del fichero cambia entre construcciones. Lo que se acredita como
#   equivalencia es el CONTENIDO (miembros y bytes de cada miembro), y los
#   hashes del artefacto certificado son los de la construcción del E2E.
# - La diferencia entre product_sha y documentation_sha es documental, pero
#   los SHA no son intercambiables: la CI exigida corresponde al product_sha.
