  gates_manifest_sha256: "PENDIENTE_RECIBOS — sha256 del artefacto agregado del recibo QG-02 del colector (el gate vault_gate --strict corre dentro del colector sobre este SHA)"
  e2e_manifest_sha256: "9d6a3c3fd2f70422fd3b15a40083fb475908f9e6ebcc9bf816abe75e820cc721 (e2e.json del recorrido 27/27)"
