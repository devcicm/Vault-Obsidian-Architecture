# Manifiesto del candidato de release — ronda R14/QA-R14-DOC-02
#
# Contrato del GOAL R14 §5, corregido por el dictamen e47d62f (QA-R14-DOC-02):
# los campos destinados a validación automática contienen SOLO el valor
# (hex puro, sin prosa); los metadatos y las notas viven en claves separadas.
#
# Convención anti-circularidad: este manifiesto vive DENTRO del árbol; el
# product_sha es el commit de congelación (padre del commit documental que
# fija este fichero). El SHA del commit que fija el manifiesto no puede
# escribirse a sí mismo: se obtiene de git en tiempo de validación (HEAD de
# la rama) y debe cumplir HEAD^ == product_sha.
#
# Validación: tests/test_manifiesto_candidato.py (formato hex, existencia del
# commit en git, relación HEAD^ == product_sha, y negativos de hash mal
# formado y SHA ajeno).

