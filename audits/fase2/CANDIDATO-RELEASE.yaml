# Manifiesto del candidato de release — ronda R14/QA-R14-DOC-02, contrato
# de ascendencia reconciliado en R17/R18 (QA-R16-DOC-01 y QA-R17-DOC-01)
#
# Contrato del GOAL R14 §5, corregido por el dictamen e47d62f (QA-R14-DOC-02):
# los campos destinados a validación automática contienen SOLO el valor
# (hex puro, sin prosa); los metadatos y las notas viven en claves separadas.
#
# CONVENCIÓN ANTI-CIRCULARIDAD (vigente): este manifiesto vive DENTRO del
# árbol, así que el SHA del commit que lo fija no puede escribirse a sí
# mismo: se obtiene de git en tiempo de validación (HEAD de la rama).
# La relación que se comprueba es de ASCENDENCIA — el product_sha es
# ANCESTRO del HEAD documental, no necesariamente su padre inmediato (puede
# haber commits documentales entre medias). El campo `doc_parent_sha` es el
# commit de PUBLICACIÓN INICIAL de este manifiesto, no el padre actual.
#
# Validación: tests/test_manifiesto_candidato.py (formato hex, existencia del
# commit en git, ascendencia del product_sha respecto al HEAD documental,
# existencia del commit de publicación inicial, y negativos de hash mal
# formado, SHA ajeno y SHA real que no es ancestro).

release_candidate:
  product_sha: 015b7765b80cac21c6dcf859ae075d036cd01def
  product_tree_sha: d190fd243567556e824795154b6fd44bd76309d5
  version: 41.23
  rama: work/release-cli-mcp-20261025
  documentation:
    # El product_sha es ANCESTRO del HEAD documental, no necesariamente su
    # padre inmediato: entre el producto y el HEAD pueden intercalarse
    # commits documentales. La prueba lo comprueba con `merge-base
    # --is-ancestor`, NO con `HEAD^` (QA-R16-DOC-01).
    product_ancestor_of_head: true
    doc_parent_sha: e0fc775551217ee0a778ca3dece0da3f0a63ba38
    doc_parent_sha_note: >-
      commit que publico por primera vez este manifiesto (R15). Es la
      publicacion inicial, no una relacion de paternidad con el HEAD.
    note: >-
      el SHA del commit que fija este manifiesto se lee de git en tiempo de
      validacion (HEAD de la rama); su relacion con product_sha es de
      ASCENDENCIA, y ese es el unico contrato que se comprueba.

