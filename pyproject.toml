[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-obsidian-architecture"
version = "41.6"
description = "Spec-Driven Development vault toolkit — persistent documental memory for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CARLOS IVAN CM" }]
keywords = [
    "obsidian", "vault", "markdown", "knowledge-management",
    "spec-driven-development", "documentation", "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# jsonschema: la suite mide schemas/ con el validador que usaria un consumidor
# sin Python (AP-44); Draft202012Validator existe desde 4.0.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.3.0", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/devcicm/Vault-Obsidian-Architecture"

[project.scripts]
vault = "vault.product_cli:main"
vault_gobernanza = "vault.gobernanza.tool:main"

[tool.setuptools]
# ADR-0002: _impl es una proyecci\u00f3n de scripts/ en la wheel. La fachada
# vault_regex.py re-exporta desde vault.kernel.regex (owner AP-50). El package-dir
# permite que vault_toolkit._impl.<module> resuelva al fichero en scripts/.
# Ver: docs/adr/0002-puente-scripts-impl.md
# v40.34: el servidor MCP viaja como package data de vault_toolkit.mcp, sin
# copia: el mismo fichero que se sirve desde el checkout (`vault mcp-path`).
# deuda #10: las normas en paquete viajan como package data de
# vault_toolkit.normas, hermana de _impl/, que es donde vault_norms_catalog las
# busca. norma.py, porque.md y las caras derivadas guard.py y heal.py; los
# test_*.py los ejecuta el repo.
package-dir = {"vault_toolkit._impl" = "scripts", "vault_toolkit.mcp" = "mcp/nodejs", "vault_toolkit.normas" = "normas"}

packages = ["vault", "vault.kernel", "vault.durabilidad", "vault.indices", "vault.grafo", "vault.consulta", "vault.gobernanza", "vault.ciclo_de_vida", "vault.meta_toolkit", "vault.autoria", "vault_toolkit", "vault_toolkit.operations", "vault_toolkit._impl", "vault_toolkit.mcp", "vault_toolkit.normas"]

# v40.34: la wheel de producto deja fuera la gobernanza del estándar (grupo 35).
# La lista no está aquí: el hook lee empaquetado/fuera-de-la-wheel.json, que
# deriva `vault_servicio --wheel-sync` y vigila `vault_servicio --check`.
[tool.setuptools.cmdclass]
build_py = "empaquetado.construir.BuildPy"

[tool.setuptools.package-data]
"vault.meta_toolkit" = ["tools-catalog.json"]
"vault.ciclo_de_vida" = ["runtime-seed.json"]
"vault_toolkit.mcp" = ["vault-mcp-server.mjs", "tools-catalog.json", "env-table.json"]
"vault_toolkit.normas" = ["*/norma.py", "*/porque.md", "*/guard.py", "*/heal.py"]
# `recursos_distribucion.entra_al_wheel` la clasifica `bootstrap`: sin ella,
# `vault_graph_merge` y `vault_init` funcionan sin ontología en la wheel.
"vault_toolkit._impl" = ["vault_ontology.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.exclude-package-data]
"*" = ["*.bak-*", "scripts.bak-*", ".history/*", "vault-backups/*"]
