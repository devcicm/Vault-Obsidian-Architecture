[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-obsidian-architecture"
version = "40.6"
description = "Spec-Driven Development vault toolkit — persistent documental memory for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CARLOS IVAN CM" }]
keywords = [
    "obsidian", "vault", "markdown", "knowledge-management",
    "spec-driven-development", "documentation", "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.3.0"]

[project.urls]
Homepage = "https://github.com/devcicm/Vault-Obsidian-Architecture"

[tool.setuptools]
# `scripts/` sigue sin declararse a propósito: se resuelve por ruta de fichero
# —el tool-spec, `cli/registry.py`, el runner del MCP y los repos consumidores
# dependen de eso— y empaquetarlo cambiaría cómo se importa. `vault/` es lo
# contrario: es un paquete de verdad, con imports relativos, y funcionaba solo
# porque los adaptadores le añaden la raíz al `sys.path`. Declararlo hace que
# una instalación lo lleve, en vez de dejarlo a merced del directorio de trabajo.
packages = ["vault", "vault.kernel", "vault.durabilidad", "vault.indices", "vault.grafo", "vault.consulta", "vault.gobernanza", "vault.ciclo_de_vida", "vault.meta_toolkit", "vault.autoria"]

[tool.setuptools.package-data]
scripts = ["tool-spec.json", "vault-obsidian-architecture.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.exclude-package-data]
"*" = ["*.bak-*", "scripts.bak-*", ".history/*", "vault-backups/*"]
