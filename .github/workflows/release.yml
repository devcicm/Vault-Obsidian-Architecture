name: Release

# Publica el GitHub Release cuando el propietario sube un tag `v*`.
#
# Por qué un workflow: publicar es un acto del propietario (DEC-06), y el acto
# es subir el tag. Lo demás —construir, comprobar que el tag es el candidato
# certificado, hashes, SBOM y notas— lo hace la máquina, igual cada vez.
#
# Fail-closed: si el tag no contiene el `product_sha` de
# audits/fase2/CANDIDATO-RELEASE.yaml, si `release_authorized` no es true o si
# la versión del tag no es la de pyproject.toml, no se publica nada.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  qg-receipts:
    # B-04: los recibos de QG-00..06 los emite la máquina sobre el candidato,
    # no una corrida a mano. El colector exige HEAD == product_sha (sobre un
    # descendiente documental devuelve QG-00 BLOCKED por CHECKOUT_EN_OTRO_SHA),
    # así que corre en un worktree del product_sha de
    # audits/fase2/CANDIDATO-RELEASE.yaml y no en el checkout del tag. Todo lo
    # que produce vive en $RUNNER_TEMP/qg, fuera del árbol: QG-00 lo quiere limpio.
    name: Recibos QG del candidato
    runs-on: ubuntu-latest
    # QG-07 es la CI del mismo SHA, y el colector la consulta con `gh`: sin
    # token el job no puede acreditar nada y QG-07 sale BLOCKED. Medido el
    # 2026-11-03 en la primera corrida real del job (v41.26): QG-00..06
    # PASS y QG-07 BLOCKED por `gh: set the GH_TOKEN environment variable`.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worktree en el product_sha
        id: candidato
        shell: bash
        run: |
          python -m pip install pyyaml
          sha=$(python -c "import yaml; print(yaml.safe_load(open('audits/fase2/CANDIDATO-RELEASE.yaml', encoding='utf-8'))['release_candidate']['product_sha'])")
          git worktree add --detach "$RUNNER_TEMP/candidato" "$sha"
          mkdir -p "$RUNNER_TEMP/qg/recibos" "$RUNNER_TEMP/qg/paridad"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/candidato" >> "$GITHUB_OUTPUT"

      - name: Dependencias del candidato
        working-directory: ${{ steps.candidato.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build pip-audit

      - name: Suite del candidato y su recibo de procedencia (QG-03)
        working-directory: ${{ steps.candidato.outputs.dir }}
        shell: bash
        env:
          SHA: ${{ steps.candidato.outputs.sha }}
        run: |
          xml="$RUNNER_TEMP/qg/suite.xml"
          set +e
          python -m pytest tests/ -q -n 4 --tb=short -p no:cacheprovider --junitxml="$xml"
          salida=$?
          set -e
          XML="$xml" SALIDA="$salida" python - <<'EOF'
          import hashlib, json, os
          xml = os.environ["XML"]
          dato = {"sha": os.environ["SHA"], "exit": int(os.environ["SALIDA"]),
                  "junit_sha256": hashlib.sha256(open(xml, "rb").read()).hexdigest(),
                  "comando": "python -m pytest tests/ -q -n 4 --tb=short -p no:cacheprovider --junitxml=suite.xml",
                  "nota": "corrida de la CI (qg-receipts) sobre el worktree del product_sha"}
          open(xml + ".procedencia.json", "w", encoding="utf-8").write(json.dumps(dato, indent=2) + "\n")
          EOF

      - name: Recorrido de tercero desde la wheel (QG-03 y QG-06)
        working-directory: ${{ steps.candidato.outputs.dir }}
        run: python audits/fase2/recorrido_terceros_r07.py --salida "$RUNNER_TEMP/qg/e2e.json"

      - name: Venv y runtime de la paridad CLI/MCP (QG-05)
        working-directory: ${{ steps.candidato.outputs.dir }}
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/qg/dist"
          python -m venv "$RUNNER_TEMP/qg/paridad/venv"
          "$RUNNER_TEMP/qg/paridad/venv/bin/python" -m pip install "$RUNNER_TEMP"/qg/dist/*.whl
          "$RUNNER_TEMP/qg/paridad/venv/bin/vault" init "$RUNNER_TEMP/qg/paridad/runtime"

      - name: Colector QG
        working-directory: ${{ steps.candidato.outputs.dir }}
        shell: bash
        env:
          # El token del job, para que QG-07 pueda consultar la CI del candidato.
          GH_TOKEN: ${{ github.token }}
        run: |
          python audits/fase2/colector_qg.py --sha "${{ steps.candidato.outputs.sha }}" \
            --ejecutar --recibos "$RUNNER_TEMP/qg/recibos" \
            --suite-xml "$RUNNER_TEMP/qg/suite.xml" \
            --e2e-json "$RUNNER_TEMP/qg/e2e.json" \
            --pip-audit-python "$(command -v python)" \
            --paridad-venv "$RUNNER_TEMP/qg/paridad/venv" \
            --paridad-runtime "$RUNNER_TEMP/qg/paridad/runtime" \
            --json "$RUNNER_TEMP/qg/recibos/colector.json"

      - name: Subir los recibos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg-recibos-${{ steps.candidato.outputs.sha }}
          path: |
            ${{ runner.temp }}/qg/recibos
            ${{ runner.temp }}/qg/suite.xml
            ${{ runner.temp }}/qg/suite.xml.procedencia.json
            ${{ runner.temp }}/qg/e2e.json

  publish:
    name: Publicar release
    # Sin recibos QG del candidato no se publica (B-04).
    needs: qg-receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: El tag es el candidato autorizado
        shell: bash
        run: |
          python -m pip install pyyaml
          python - <<'EOF'
          import os, subprocess, sys, tomllib, yaml
          tag = os.environ["GITHUB_REF_NAME"]
          m = yaml.safe_load(open("audits/fase2/CANDIDATO-RELEASE.yaml", encoding="utf-8"))
          rc = m["release_candidate"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          errores = []
          if tag != f"v{version}":
              errores.append(f"tag {tag} != v{version} (pyproject.toml)")
          if str(rc.get("version")) != version:
              errores.append(f"manifiesto version {rc.get('version')} != {version}")
          if m.get("governance", {}).get("release_authorized") is not True:
              errores.append("release_authorized no es true en el manifiesto")
          sha = rc["product_sha"]
          ci = m.get("verification", {}).get("ci", {})
          if ci.get("run_sha") != sha:
              errores.append(f"la CI certificada es de {ci.get('run_sha')}, no del product_sha {sha}")
          if ci.get("conclusion") != "success":
              errores.append(f"la CI del candidato no concluyo en success ({ci.get('conclusion')})")
          if subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"]).returncode:
              errores.append(f"product_sha {sha} no es ancestro del tag")
          tree = subprocess.run(["git", "rev-parse", f"{sha}^{{tree}}"],
                                capture_output=True, text=True).stdout.strip()
          if rc.get("product_tree_sha") != tree:
              errores.append(f"product_tree_sha {rc.get('product_tree_sha')} no es el arbol de {sha} ({tree or 'sha inexistente'})")
          # El ancestro es una relacion historica, no una identidad de
          # contenido: un descendiente que cambia el producto tambien es
          # ancestro, y se publicaba sin haber pasado por la CI certificada.
          # Lo que se publica es el ARBOL del tag, y tiene que ser el
          # certificado (nota de causa raiz «Release publishes content the
          # certified CI never saw», 2026-10-30). Un delta solo documental
          # tendria que declararse aqui, con su lista de rutas; mientras no
          # exista esa lista, la puerta es estricta.
          tree_tag = subprocess.run(["git", "rev-parse", "HEAD^{tree}"],
                                    capture_output=True, text=True).stdout.strip()
          if tree_tag != tree:
              errores.append(
                  f"el producto del tag ({tree_tag or 'arbol desconocido'}) no es "
                  f"el certificado ({tree or 'arbol desconocido'}): el tag apunta "
                  f"a otro contenido que la CI no vio")
          qg = m.get("governance", {}).get("qg_statuses") or {}
          for i in range(8):
              if qg.get(f"QG-0{i}") != "PASS":
                  errores.append(f"QG-0{i} no esta en PASS ({qg.get(f'QG-0{i}')})")
          # B-05: las referencias de gobierno son ficheros reales de audits/, no strings.
          # El centinela de `qa_verdict_ref` (PENDIENTE / OMITIDO_POR_PROPIETARIO, DEC-06)
          # se admite; si hace falta un dictamen real lo decide B-06, no esta puerta.
          from pathlib import Path
          def ref_real(valor):
              if not isinstance(valor, str) or not valor.startswith("audits/") or ".." in valor.split("/"):
                  return False
              return Path(valor).is_file()
          gov = m.get("governance", {})
          if not ref_real(gov.get("owner_decision_ref")):
              errores.append(f"owner_decision_ref no es un fichero de audits/ ({gov.get('owner_decision_ref')!r})")
          qa = gov.get("qa_verdict_ref")
          if qa not in ("PENDIENTE", "OMITIDO_POR_PROPIETARIO") and not ref_real(qa):
              errores.append(f"qa_verdict_ref no es un fichero de audits/ ni un centinela declarado ({qa!r})")
          if errores:
              print("NO SE PUBLICA:\n  " + "\n  ".join(errores)); sys.exit(1)
          print(f"OK: {tag} contiene el candidato {sha[:7]} | QA: {qa}")
          EOF

      - name: Construir wheel y sdist
        run: |
          python -m pip install build
          python -m build

      - name: Puertas de producto sobre la wheel instalada
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python tests/run_product_gates.py

      - name: SBOM, inventario de licencias y SHA-256
        shell: bash
        run: |
          python empaquetado/sbom.py --salida dist/sbom.spdx.json
          python empaquetado/sbom.py --inventario
          cd dist && sha256sum *.whl *.tar.gz sbom.spdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Crear el GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="audits/release/NOTAS-${GITHUB_REF_NAME}.md"
          test -f "$notas" || { echo "faltan las notas $notas"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            dist/sbom.spdx.json dist/SHA256SUMS.txt \
            --title "Vault Obsidian Architecture $GITHUB_REF_NAME" \
            --notes-file "$notas" --verify-tag
