name: Vault CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Alcance 2026-10-28: Windows + Linux. macOS salió de la matriz y del
# classifier a la vez (`tests/test_ci_python_matrix.py` exige que coincidan):
# sus 8 jobs eran los que más esperaban runner y alargaban cada corrida.
#
# Un push nuevo a la misma rama/PR cancela la corrida anterior: en R22 siete
# corridas seguidas sobre la misma rama sumaron horas de cola para validar
# solo la última.
concurrency:
  group: vault-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Vault Spec
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # El piso tiene que ejecutarse en algún sitio o no es soporte, es una
        # promesa. `pyproject.toml` dice >=3.9 y aquí solo corría 3.11: seis
        # sitios rompían al IMPORTAR en 3.9 —`ast.AST | None` evaluado al
        # definir— sin que nada lo viera, dos de ellos en módulos que importa
        # medio repo. `tests/test_piso_python.py` falla si esta lista y
        # `requires-python` vuelven a divergir.
        python-version: ['3.9', '3.10', '3.11', '3.12']
        # La suite se parte en dos trozos por columna (`tests/reparto.py`,
        # por módulo y equilibrado por duración). Antes la columna de Windows
        # tardaba ~40 min y marcaba el reloj de toda la corrida.
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Historia completa SOLO aquí. Los tres jobs del workflow se distinguen
        # por lo que consultan: `validate` corre la suite, y la suite tiene 18
        # tests que hablan con git por su cuenta (run 40299732445: con el
        # checkout superficial que `checkout@v4` trae por defecto —`--depth=1`
        #— `vault_changelog_check`, `vault_contrato_nota`, `vault_metricas` y
        # el auditor de exposición histórica no resuelven commits, blobs ni
        # rangos que SÍ existen en GitHub (`test_todos_los_hashes_publicados_
        # existen` marcó la lista de versiones con «hash inexistente» solo
        # por la profundidad). `product-gates` y `lint` no leen historia —
        # construyen la wheel y compilan—, así que siguen baratos.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Las dependencias salen de pyproject.toml, su dueño. Antes se
          # instalaban pytest y pytest-cov a mano y PyYAML —la única dependencia
          # declarada— no se instalaba en ninguna parte.
          pip install -e ".[dev]"

      # El sandbox lo materializa la CI, no la suite. Si lo hace pytest, se
      # adueña de él y lo limpia al terminar, y las puertas de abajo corren
      # contra un runtime vacío: `vault_doc_staleness` salía rojo solo aquí.
      - name: Bootstrap del sandbox
        run: python tests/sandbox_fixture.py --bootstrap

      # La forma canónica de la suite es `pytest tests/ -q -n auto` (la dice
      # `pyproject.toml` y el checklist del repo). La CI la corría secuencial:
      # los mismos tests, el doble de reloj. `-n auto` usa los núcleos del
      # runner y no cambia ninguna aserción.
      #
      # El JUnit se publica como artefacto: sin él, un job en curso no tiene
      # log parcial descargable (la API solo lo materializa al terminar) y un
      # fallo de CI llega sin el detalle de qué test falló. Con el artefacto,
      # el recibo de cada columna es comprobable por quien lo audite.
      - name: Run unit tests
        env:
          VAULT_SHARD: ${{ matrix.shard }}/2
        run: python -m pytest tests/ -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: junit.xml

  gates:
    # Las puertas, el smoke y los pasos del estándar miden el REPOSITORIO, no
    # el intérprete: se ejecutan una vez por sistema, en un job propio que
    # corre en paralelo con la suite. Antes iban detrás de la suite en cada
    # columna: ~10 min en serie sobre la ruta crítica. Máquina aparte, así
    # que tampoco comparten `vault-sandbox/` con la suite (AGENTS.md).
    name: Puertas del estándar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Una sola versión y fuera de la matriz: la matriz de Python la
        # ejerce la suite (`tests/test_ci_python_matrix.py` exige que toda
        # matriz de Python arranque en el piso).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap del sandbox
        run: python tests/sandbox_fixture.py --bootstrap

      # Las puertas, preguntándole al registro en vez de listándolas a mano.
      #
      # Hasta v40.19 este fichero enumeraba seis puertas escritas una a una:
      # catálogo, framework, conteos, doc_sync, contratos y noop. El registro
      # `vault_gate.PUERTAS` tenía diecisiete, así que **once no se ejecutaban
      # en ningún PR** — changelog, arquitectura, servicio, blueprint,
      # norms_coherence, criterios, fuente_unica, ciclos entre ellas. Ninguna se
      # rompió: la lista simplemente se quedó quieta mientras el registro crecía,
      # que es como envejece una copia. Es AP-57 a través de la frontera
      # Python↔YAML, y `vault_criterios` lo mide desde v40.19.
      #
      # Una puerta nueva entra aquí sola, el día que entra en el registro.
      - name: Puertas del estándar (registro vault_gate, todas)
        run: python scripts/vault_gate.py --strict

      # AP-40: ningún param publicado por MCP puede ser rechazado por la CLI.
      # Se audita el JSON generado, que es lo que el servidor consume de verdad.
      - name: Catalog params check (AP-40, contrato ↔ argparse)
        run: python scripts/vault_mcp_catalog.py --check-params

      # AP-42: el ejemplo documentado de cada tool se ejecuta de verdad contra
      # una copia desechable del sandbox. La baseline está en 0: guard duro.
      - name: Smoke de ejecución (AP-42, toda tool se ejecuta)
        run: python scripts/vault_smoke.py --check --strict

      # AP-36: falla si algún side-effect se escribió fuera del vault (hasta 2
      # niveles por encima) o si la raíz se resolvió por suposición.
      - name: Containment audit (AP-36, strict)
        run: python scripts/vault_norms.py --audit --root vault-sandbox --strict

      # Lo que el estándar genera cumple su propio contrato. Hasta 2026-10-15
      # estos pasos validaban `vault-sandbox/`, que lleva a propósito veinte
      # notas defectuosas para los tests de salud, y terminaban en
      # `|| echo "not yet implemented"`: fallaban siempre y salían verdes.
      # `vault_audit` llevaba además un `--dry-run` que no existe (rc 2).
      # `tests/test_ci_sin_enmascarar.py` ejerce lo mismo y prohíbe el `|| echo`.
      - name: Vault recién creado valida y audita limpio
        shell: bash
        run: |
          export VAULT_ROOT="$RUNNER_TEMP/vault-limpio" VAULT_STRICT_ROOT=1
          mkdir -p "$VAULT_ROOT"
          python scripts/vault_init.py > /dev/null
          python scripts/vault_validate.py > /dev/null
          python scripts/vault_audit.py > /dev/null

      # Paso duro desde 2026-10-16: `returns_match`, que solo veía claves
      # escritas como literal en un `return {...}`, quedó superseded por
      # `vault_smoke.contract_gap` (envelope emitido). Lo que queda —script,
      # required_args, carpeta— se mide contra el dueño.
      - name: vault_spec_validate
        run: python scripts/vault_spec_validate.py

      - name: Run vault_norms --list
        working-directory: scripts
        # `shell: bash` por una razón medida, no por gusto: con el shell por
        # defecto (PowerShell en Windows) las comillas del `python -c` se
        # pierden al pasar el argumento y el código llega partido
        # («SyntaxError: '[' was never closed»). Medido el 2026-10-26: las
        # cuatro columnas de Windows fallaban en este paso y las de Ubuntu
        # pasaban, con el MISMO código. Con bash —que está en los tres
        # runners, y es el shell que ya usan el paso de la wheel y el de
        # SBOM— y comillas simples dentro del código, el paso es el mismo en
        # los tres sistemas.
        shell: bash
        run: |
          cd ..
          python scripts/vault_norms.py --list --type ap | python -c "import json,sys; d=json.load(sys.stdin); print('AP norms registered:', d['total'])"

      # El manifiesto público del estándar (`vault-obsidian-architecture.md`)
      # debe pasar su propio AP-25. Sin este guard, el estándar puede publicar
      # diagramas que rompen la métrica de cualquier hijo que los incluya en
      # su raíz. `tests/test_manifiesto_pasa_ap25.py` corre dentro de la suite
      # (más rápido, en cada PR); este paso lo cruza también por `vault_mermaid_check`
      # para tener el camino del consumidor ejercitado de verdad.
      - name: Manifiesto del estándar cumple AP-25
        shell: bash
        run: |
          python -c "
          import re, sys
          sys.path.insert(0, 'vault')
          from vault.kernel.mermaid_reglas import validate_mermaid
          text = open('vault-obsidian-architecture.md', encoding='utf-8', errors='replace').read()
          errores = []
          for i, m in enumerate(re.finditer(r'\`\`\`mermaid\n(.*?)\n\`\`\`', text, re.DOTALL), 1):
              for e in validate_mermaid(m.group(1)):
                  if str(e.get('severity','error')).lower() == 'error':
                      errores.append((i, e.get('type','?'), e.get('message','')))
          if errores:
              print('AP-25 roto en el manifiesto:')
              for i, t, msg in errores: print(f'  bloque {i}: {t}: {msg}')
              sys.exit(1)
          print(f'OK: {len(re.findall(chr(96)*3+r\"mermaid\", text))} bloques validados')
          "

  product-gates:
    name: Product gates (wheel)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      # TD-0001 (fase 2, L3): las puertas de producto importan el paquete
      # (`vault.meta_toolkit.distribucion`), que necesita PyYAML — una
      # dependencia DECLARADA de la wheel. El job solo instalaba `build`, de
      # modo que el gate moria con `ModuleNotFoundError: No module named
      # 'yaml'` antes de empezar, y el job no podia pasar nunca. Instalar la
      # wheel construida deja el artefacto y sus dependencias en el runner, y
      # las puertas pasan a medir el producto instalado.
      # `shell: bash` para que el glob de la wheel se expanda igual en los
      # tres sistemas (el runner de Windows trae Git Bash); es el mismo shell
      # que usa el paso de SBOM de este mismo job.
      - name: Install wheel (artefacto y dependencias declaradas)
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Run product gates
        run: python tests/run_product_gates.py

      # ISO/IEC 5962 (SPDX) + ISO/IEC 5230 (inventario de licencias). La wheel
      # se instala para que versión y licencia de cada dependencia se midan
      # de sus metadatos; sin licencia afirmada, el paso falla.
      - name: SBOM SPDX and license inventory
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python empaquetado/sbom.py --salida dist/sbom.spdx.json
          python empaquetado/sbom.py --inventario

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/sbom.spdx.json

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        working-directory: scripts
        run: |
          cd ..
          python -m py_compile scripts/*.py