name: Vault CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Vault Spec
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/ --tb=short

      - name: Catalog sync check
        run: python scripts/vault_mcp_catalog.py --check

      - name: Run vault_validate
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_validate.py || echo "vault_validate not yet implemented"

      - name: Run vault_audit (dry run)
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_audit.py --dry-run || echo "audit dry-run not yet implemented"

      - name: Run vault_spec_validate
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_spec_validate.py || echo "spec_validate not yet implemented"

      - name: Run vault_norms --list
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_norms.py --list --type ap | python -c "import json,sys; d=json.load(sys.stdin); print(f'AP norms registered: {d[\"total\"]}')"

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        working-directory: scripts
        run: |
          cd ..
          python -m py_compile scripts/*.py