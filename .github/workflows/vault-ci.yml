name: Vault CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Vault Spec
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/ --tb=short

      - name: Catalog sync check
        run: python scripts/vault_mcp_catalog.py --check

      - name: Framework drift check (registro canónico ↔ manifiesto)
        run: python scripts/vault_norms.py --check-framework

      # Ninguna cifra de la documentación se escribe a mano sin verificarse.
      # Sin --no-slow: aquí sí se cuenta la suite, que es la cifra que más
      # envejece. El changelog queda excluido por diseño (es historia).
      - name: Doc counts drift check (cifras ↔ registro)
        run: python scripts/vault_doc_counts.py --check --strict

      # La otra mitad del mismo problema: los nombres. Una tool nueva que no
      # llega a scripts/README.md existe pero es invisible en la referencia.
      - name: Doc sync check (catálogo ↔ scripts/README.md)
        run: python scripts/vault_doc_sync.py --check --strict

      # Y la tercera: los contratos. Una tool sin entrada en tool-spec.json se
      # expone por MCP sin que nadie pueda validar lo que devuelve.
      - name: Contract sync check (catálogo ↔ tool-spec.json)
        run: python scripts/vault_mcp_catalog.py --check-contracts

      # AP-37: la deuda de tools sin indicador de trabajo no bloquea, pero no
      # puede crecer. Falla solo si aparece una infractora NUEVA.
      - name: No-op audit (AP-37, la deuda no crece)
        run: python scripts/vault_noop_audit.py --check --strict

      # AP-40: ningún param publicado por MCP puede ser rechazado por la CLI.
      # Se audita el JSON generado, que es lo que el servidor consume de verdad.
      - name: Catalog params check (AP-40, contrato ↔ argparse)
        run: python scripts/vault_mcp_catalog.py --check-params

      # AP-42: el ejemplo documentado de cada tool se ejecuta de verdad contra
      # una copia desechable del sandbox. La baseline está en 0: guard duro.
      - name: Smoke de ejecución (AP-42, toda tool se ejecuta)
        run: python scripts/vault_smoke.py --check --strict

      # AP-36: falla si algún side-effect se escribió fuera del vault (hasta 2
      # niveles por encima) o si la raíz se resolvió por suposición.
      - name: Containment audit (AP-36, strict)
        run: python scripts/vault_norms.py --audit --root vault-sandbox --strict

      - name: Run vault_validate
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_validate.py || echo "vault_validate not yet implemented"

      - name: Run vault_audit (dry run)
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_audit.py --dry-run || echo "audit dry-run not yet implemented"

      - name: Run vault_spec_validate
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_spec_validate.py || echo "spec_validate not yet implemented"

      - name: Run vault_norms --list
        working-directory: scripts
        run: |
          cd ..
          python scripts/vault_norms.py --list --type ap | python -c "import json,sys; d=json.load(sys.stdin); print(f'AP norms registered: {d[\"total\"]}')"

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        working-directory: scripts
        run: |
          cd ..
          python -m py_compile scripts/*.py